# ai-toolkit (ostris) config template for the persona LoRA on Qwen-Image 2512.
# Rendered by `cm lora train --base qwen` (comfy_model.lora.render_training_config).
# Based on config/examples/train_lora_qwen_image_24gb.yaml at the commit in pod/versions.env.
job: extension
config:
  name: "{{name}}"
  process:
    - type: sd_trainer
      training_folder: /workspace/ai-toolkit/output
      device: cuda:0
      trigger_word: "{{trigger}}"
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/workspace/dataset/{{trigger}}"
          caption_ext: txt
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 0.0001
        dtype: bf16
      model:
        name_or_path: Qwen/Qwen-Image-2512
        arch: qwen_image
        quantize: true
        qtype: qfloat8
        quantize_te: true
        qtype_te: qfloat8
        low_vram: true
      sample:
        sampler: flowmatch
        sample_every: 500
        width: 1024
        height: 1024
        prompts: "{{sample_prompts}}"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 3
        sample_steps: 25
meta:
  name: "{{name}}"
  version: "1.0"
