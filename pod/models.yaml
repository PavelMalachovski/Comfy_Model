# Model files fetched onto the network volume by pod/bootstrap.sh.
# dest = subfolder of ComfyUI/models/. URL = https://huggingface.co/{repo}/resolve/main/{path}
# unless an explicit `url:` is given. Every literal model filename in workflows/*.json
# must appear here (tests/test_workflow.py enforces it). The persona LoRA is not listed:
# it is trained by the operator and uploaded to models/loras/ separately.
models:
  # FLUX.1-dev fp8 all-in-one checkpoint (face, photo)
  - file: flux1-dev-fp8.safetensors
    dest: checkpoints
    repo: Comfy-Org/flux1-dev
    path: flux1-dev-fp8.safetensors

  # FLUX.1 Kontext dev (dataset)
  - file: flux1-dev-kontext_fp8_scaled.safetensors
    dest: diffusion_models
    repo: Comfy-Org/flux1-kontext-dev_ComfyUI
    path: split_files/diffusion_models/flux1-dev-kontext_fp8_scaled.safetensors
  - file: clip_l.safetensors
    dest: text_encoders
    repo: comfyanonymous/flux_text_encoders
    path: clip_l.safetensors
  - file: t5xxl_fp8_e4m3fn_scaled.safetensors
    dest: text_encoders
    repo: comfyanonymous/flux_text_encoders
    path: t5xxl_fp8_e4m3fn_scaled.safetensors
  - file: ae.safetensors
    dest: vae
    repo: Comfy-Org/Lumina_Image_2.0_Repackaged
    path: split_files/vae/ae.safetensors

  # Wan 2.2 TI2V 5B (video)
  - file: wan2.2_ti2v_5B_fp16.safetensors
    dest: diffusion_models
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    path: split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors
  - file: wan2.2_vae.safetensors
    dest: vae
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    path: split_files/vae/wan2.2_vae.safetensors
  - file: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    dest: text_encoders
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    path: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors

  # photo post-processing
  - file: RealESRGAN_x4plus.pth
    dest: upscale_models
    url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
  # Impact Subpack UltralyticsDetectorProvider reads models/ultralytics/bbox/ ("bbox/face_yolov8m.pt")
  - file: face_yolov8m.pt
    dest: ultralytics/bbox
    repo: Bingsu/adetailer
    path: face_yolov8m.pt
