# X (Twitter), Reddit and the paid Telegram channel: femdom showcase.
# Latex, lingerie, corsets, boots and heels allowed; always opaque, named garments; no nudity.
# Feet close-ups come in phase 2 (feet detailer). Mark media as sensitive (X) / NSFW (Reddit).
# Scene prompts describe only setting, outfit, pose, light and camera; the appearance
# sentence and style suffix come from character/profile.yaml automatically.
# Run (after LoRA training; adjust the file name to your version):
#   cm batch photo scenes/social.yaml --lora ohwxroxana_v1.safetensors
defaults:
  tier: "social"
  aspect: "4:5"
  count: 2

scenes:
