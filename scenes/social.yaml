    aspect: "9:16"
    prompt: "lounging in a leather armchair in a red latex dress, black stiletto heels, moody lamp light"
  - id: latex-gloves-crop
    prompt: "close-up of black latex gloves holding a riding crop, her face in soft focus behind"
