# 30 edit instructions for the Qwen-Image-Edit dataset; a subset of scenes/dataset.yaml.
# Run with the chosen face and --workflows workflows/qwen.
defaults:
  tier: instagram
  aspect: '4:5'
  count: 1
scenes:
- id: front-closeup-neutral
  prompt: Keep the same woman's face and identity, close-up portrait from the front, neutral expression, soft window light,
    plain wall background.
- id: front-closeup-smirk
  prompt: Keep the same woman's face and identity, close-up portrait from the front, slight smirk, studio softbox light, dark
    background.
- id: left-profile-closeup
  prompt: Keep the same woman's face and identity, left side profile close-up, hair tied in a high ponytail, soft daylight.
- id: right-profile-closeup
  prompt: Keep the same woman's face and identity, right side profile close-up, hair down, warm evening light.
- id: three-quarter-left-portrait
  prompt: Keep the same woman's face and identity, three-quarter view from the left, head and shoulders, black turtleneck,
    studio light.
- id: three-quarter-right-portrait
  prompt: Keep the same woman's face and identity, three-quarter view from the right, head and shoulders, white shirt, window
    light.
- id: looking-down-camera-low
  prompt: Keep the same woman's face and identity, head and shoulders seen from slightly below, she looks down at the camera,
    cold expression, plain ceiling behind.
- id: looking-up-camera-high
  prompt: Keep the same woman's face and identity, head and shoulders seen from slightly above, she looks up into the camera,
