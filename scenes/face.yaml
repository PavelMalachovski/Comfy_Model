# Face exploration: neutral portraits of Roxana under six lights. Pick ONE face you like
# (clearly adult, about 40, resembling nobody real - check with a reverse image search),
# then use it as --ref for scenes/dataset.yaml.
# Scene prompts describe only setting, outfit, pose, light and camera; the appearance
# sentence and style suffix come from character/profile.yaml automatically.
# Run (needs a running pod, see `cm pod up`):
#   cm batch face scenes/face.yaml
defaults:
  tier: "instagram"
  aspect: "4:5"
  count: 4

scenes:
  - id: face-window-light
    prompt: "head and shoulders portrait, plain dark grey wall, soft window light from the left, neutral expression, looking straight into the camera, 85mm lens"
  - id: face-golden-hour
    prompt: "head and shoulders portrait on a Dubai balcony at golden hour, warm low sun, slight smirk, 85mm lens, shallow depth of field"
  - id: face-studio-softbox
    prompt: "studio portrait against a black backdrop, large softbox key light, black turtleneck, calm cold stare, 85mm lens"
  - id: face-low-key
    prompt: "low-key dramatic portrait, single hard light from above and to the side, deep shadows, black blazer, chin slightly raised"
  - id: face-night-neon
    prompt: "night portrait on a city street in Dubai, neon reflections in her eyes, black leather jacket, three-quarter view"
  - id: face-warm-lamp
    prompt: "portrait in a dim penthouse living room, warm lamp light, cream silk blouse, relaxed confident expression, three-quarter view"
