# Instagram showcase and free Telegram channel: a powerful, luxurious woman in Dubai.
# SFW only: no lingerie, no latex or fetish cues, no feet close-ups, no nudity (enforced by cm).
# Scene prompts describe only setting, outfit, pose, light and camera; the appearance
# sentence and style suffix come from character/profile.yaml automatically.
# 30 scenes x 2 variants -> pick the best 30. 4:5 = feed, 9:16 = stories/Reels covers.
# Run (after LoRA training; adjust the file name to your version):
#   cm batch photo scenes/instagram.yaml --lora ohwxroxana_v1.safetensors
defaults:
  tier: "instagram"
  aspect: "4:5"
  count: 2

scenes:
  - id: penthouse-skyline-gown
    aspect: "9:16"
    prompt: "standing at the floor-to-ceiling window of a Dubai penthouse, black satin evening gown, city skyline at dusk behind her, looking back over her shoulder, camera slightly below eye level"
  - id: desert-dunes-black-gown
    prompt: "standing on a desert dune at sunset in a long black gown, fabric moving in the wind, golden light, full body, low camera angle"
  - id: yacht-deck-white-linen
    prompt: "sitting on the deck of a luxury yacht, white linen shirt and black trousers, sunglasses in hand, turquoise sea, bright midday light"
  - id: boutique-shopping-bags
    prompt: "walking out of a luxury boutique holding shopping bags, camel coat, red-soled heels, street level shot"
  - id: rooftop-bar-evening
    aspect: "9:16"
    prompt: "seated at a rooftop bar in Dubai at night, black dress, cocktail glass, skyline bokeh, three-quarter view"
  - id: boardroom-head-of-table
    prompt: "standing at the head of a long boardroom table, tailored black power suit, hands resting on the table, glass walls, cold daylight"
  - id: luxury-car-door
    prompt: "stepping out of a black luxury car, leather trench coat, knee-high leather boots, night street, camera low"
  - id: velvet-armchair-throne
    aspect: "9:16"
    prompt: "seated in a large dark-red velvet throne-like armchair, legs crossed, black dress, dim moody lighting, camera at seat height"
  - id: leather-gloves-close
    prompt: "close-up of her pulling on black leather gloves, cold stare at the camera, dark background"
  - id: leather-trench-street
    prompt: "walking toward the camera on a wet-free night street, belted black leather trench coat, knee-high boots, city lights"
  - id: marble-staircase-red-gown
    aspect: "9:16"
    prompt: "descending a marble staircase in a long red evening gown, hand on the railing, grand hotel lobby"
  - id: glass-desk-office
    prompt: "sitting behind a large glass desk, white silk blouse, pen in hand, Dubai skyline window behind, looking up at the camera"
  - id: private-jet-cabin
    prompt: "seated in a cream leather seat of a private jet, black turtleneck, champagne glass, window light"
  - id: terrace-morning-coffee
    prompt: "on a penthouse terrace in the morning, silk blouse, coffee cup, sunglasses, soft sunlight"
  - id: hotel-lobby-walk
    aspect: "9:16"
    prompt: "walking through a luxury hotel lobby, black suit, heels, people blurred in the background"
  - id: dinner-candle-light
    prompt: "seated at a fine dining table, black dress, candle light, untouched dessert in front of her, slight smirk"
  - id: desert-camp-shawl
    prompt: "sitting on cushions in a desert camp at sunset, black shawl over her shoulders, lanterns, warm light"
  - id: palm-island-view
    aspect: "9:16"
    prompt: "standing on a balcony overlooking the palm-shaped island in Dubai, white dress, wind in her hair, daylight"
  - id: art-gallery
    prompt: "standing in a modern art gallery in front of a large abstract painting, black blazer, arms crossed"
  - id: spa-robe-lounge
    prompt: "relaxing in a spa lounge in a thick white robe belted closed, cucumber water, calm expression"
  - id: gym-power-pose
    prompt: "in a modern gym, black sports top and leggings, standing with hands on hips, mirror wall, bright light"
  - id: winter-memory-siberia
    aspect: "9:16"
    prompt: "old-money winter look: black coat with fur-trimmed hood, snowy birch forest, cold blue light"
  - id: sunset-pool-edge
    prompt: "sitting at an infinity pool edge in a black one-piece swimsuit with both straps visible, Dubai skyline at sunset"
  - id: chess-game
    prompt: "playing chess at a marble table, black dress, looking at the camera instead of the board, dim warm light"
  - id: elevator-glass-city
    aspect: "9:16"
    prompt: "standing in a glass elevator rising over the city at night, black suit, reflection in the glass"
  - id: bookshelf-library
    prompt: "in a private library, reading glasses, holding an open book, tall bookshelves, warm lamp light"
  - id: mirror-earrings
    prompt: "fastening diamond earrings in a hotel suite mirror, black evening dress, soft light"
  - id: sports-car-wheel
    prompt: "sitting behind the wheel of a sports car, sunglasses, black leather jacket, desert highway outside"
  - id: balcony-night-wine
    aspect: "9:16"
    prompt: "leaning on a balcony rail at night with a glass of red wine, black dress, skyline lights"
  - id: red-soled-heels-stairs
    prompt: "sitting on outdoor marble stairs, black suit, red-soled heels in focus in the foreground, low camera angle"
