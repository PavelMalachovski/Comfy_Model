# yoga from behind in tight leggings) but no nudity; nudity words are blocked by the filter.
# On X every media post is marked sensitive. From day 15 X also gets blurred or cropped
# frames from scenes/fanvue_sets.yaml with the Fanvue link.
# Ids are x<nn>-<shot>. Render on the Mac (~11 min per frame, 48 frames ~9 hours):
#   CM_WAIT_TIMEOUT_S=3600 .venv/bin/cm batch photo scenes/plan50_x.yaml \
#     --profile character/profile_phone.yaml --lora ohwxroxana_v4.safetensors --strength 0.8 \
#     --workflows workflows/qwen-mac-fast --out out/dev/plan50-x --url http://127.0.0.1:8188
# then scripts/phone_finish.py out/dev/plan50-x out/dev/plan50-x-final --hdr 0.5
