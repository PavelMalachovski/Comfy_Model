# Dataset edit instructions for LoRA training (FLUX Kontext). Every instruction is used
# verbatim and starts "Keep the same woman's face and identity, " so Kontext edits the
# reference photo into a new angle / framing / outfit / setting / light while keeping her.
# Mix: front / three-quarter / profile; close-up / half body / full body; hoodie+glasses,
# dress, gym, swimsuit, coat and casual outfits; indoor and outdoor; day and evening.
# No lingerie here (dataset prompts follow the instagram tier rules).
# Run with the chosen face reference image (see scenes/face.yaml):
#   cm batch dataset scenes/dataset.yaml --ref out/<date>-face/face-window-light-1.png
defaults:
  tier: instagram
  aspect: "4:5"
  count: 1

scenes:
  - id: front-closeup-neutral
    prompt: >-
      Keep the same woman's face and identity, close-up portrait from the front, neutral
      expression, soft window light, plain wall background.
  - id: front-closeup-smile
    prompt: >-
      Keep the same woman's face and identity, close-up portrait from the front with a
      small natural smile, soft daylight, blurred cafe behind her.
  - id: three-quarter-closeup-hoodie
    prompt: >-
      Keep the same woman's face and identity, three-quarter view close-up, wearing a grey
      oversized hoodie, hair loose, bright indoor daylight.
  - id: profile-closeup-street
    prompt: >-
      Keep the same woman's face and identity, side profile close-up, looking away from
      the camera, outdoors on a calm street, overcast light.
  - id: profile-closeup-lamp
    prompt: >-
      Keep the same woman's face and identity, side profile close-up, warm lamp light from
      the front, dark room behind, quiet evening mood.
  - id: front-half-hoodie-glasses
    prompt: >-
      Keep the same woman's face and identity, half body shot from the front, wearing an
      oversized charcoal hoodie and round glasses, sitting at a wooden desk, soft
      window light.
  - id: front-half-hoodie-terminal
    prompt: >-
      Keep the same woman's face and identity, half body shot from the front, wearing a
      black hoodie and glasses, a laptop with a dark terminal window in front of
      her, warm desk lamp.
  - id: three-quarter-half-hoodie-park
    prompt: >-
      Keep the same woman's face and identity, three-quarter half body shot, wearing a
      beige hoodie and glasses, holding a paper coffee cup, walking in a green city
      park, daytime.
  - id: profile-half-hoodie-balcony
    prompt: >-
      Keep the same woman's face and identity, half body shot from the side, wearing a
      grey hoodie and glasses, leaning on a balcony railing, morning light.
  - id: front-half-dress-evening
    prompt: >-
      Keep the same woman's face and identity, half body shot from the front, wearing a
      simple black evening dress, indoor restaurant with warm candle light, evening.
  - id: three-quarter-half-dress-street
    prompt: >-
      Keep the same woman's face and identity, three-quarter half body shot, wearing a
      dark green midi dress, old town cobblestone street at dusk, warm street lamps.
  - id: profile-half-dress-terrace
    prompt: >-
      Keep the same woman's face and identity, half body shot from the side, wearing an
      elegant navy dress, rooftop terrace at sunset, city skyline blurred behind.
  - id: front-full-dress-hall
    prompt: >-
      Keep the same woman's face and identity, full body shot from the front, wearing a
      long black evening dress and heels, standing in a bright hotel lobby, evening.
  - id: three-quarter-full-dress-garden
    prompt: >-
      Keep the same woman's face and identity, full body shot, three-quarter view, wearing
