    prompt: "Keep the same woman's face and identity, close-up portrait from the front, neutral expression, soft window light, plain wall background."
  - id: front-closeup-smirk
    prompt: "Keep the same woman's face and identity, close-up portrait from the front, slight smirk, studio softbox light, dark background."
  - id: left-profile-closeup
    prompt: "Keep the same woman's face and identity, left side profile close-up, hair tied in a high ponytail, soft daylight."
  - id: right-profile-closeup
    prompt: "Keep the same woman's face and identity, right side profile close-up, hair down, warm evening light."
  - id: three-quarter-left-portrait
    prompt: "Keep the same woman's face and identity, three-quarter view from the left, head and shoulders, black turtleneck, studio light."
  - id: three-quarter-right-portrait
    prompt: "Keep the same woman's face and identity, three-quarter view from the right, head and shoulders, white shirt, window light."
