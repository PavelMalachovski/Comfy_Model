# Image-to-video Reels (Instagram tier): subtle motion on top of a finished still.
# NOTE: the `image:` paths below are PLACEHOLDERS (relative to scenes/). Replace them with real
# 9:16 photos exported by `cm export` from scenes/instagram.yaml (they must exist in export/).
# Prompts describe ONLY motion; they are used verbatim.
# Run (needs a running pod, see `cm pod up`):
#   cm batch video scenes/video.yaml
defaults:
  tier: "instagram"
  aspect: "9:16"
  count: 1

scenes:
  - id: heels-walk-lobby
    image: ../export/hotel-lobby-walk_01.jpg
    prompt: "she walks slowly toward the camera in heels, steady confident pace, slight smirk at the end, camera tracking backward"
  - id: gloves-pull-on
    image: ../export/leather-gloves-close_01.jpg
    prompt: "she slowly pulls on a black leather glove, flexes her fingers, then looks up into the camera"
  - id: turn-to-camera-smirk
    image: ../export/penthouse-skyline-gown_01.jpg
    prompt: "she turns her head from the city view toward the camera and gives a cold smirk, hair moving slightly"
  - id: yacht-hair-wind
    image: ../export/yacht-deck-white-linen_01.jpg
    prompt: "hair moving in the sea breeze, she lowers her sunglasses and looks into the camera"
  - id: throne-leg-cross
    image: ../export/velvet-armchair-throne_01.jpg
    prompt: "seated on the throne, she slowly uncrosses and recrosses her legs and rests her chin on her hand"
